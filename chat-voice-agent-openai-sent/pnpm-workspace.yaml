# Security patch for an advisory in the Sent SDK's unused Node proxy dependency chain
# (previously npm "overrides" in package.json, which pnpm does not read).
overrides:
  basic-ftp: 6.2.2

# pnpm only runs dependency install scripts that are allowed here.
allowBuilds:
  # Official platform-binary check for tsx's bundler.
  esbuild: true
  # Not needed: with TUNNEL_PROVIDER=cloudflare, the app downloads the cloudflared binary on first Start (server/tunnel.ts).
  # @ngrok/ngrok, the default tunnel, has no install script: its native build is a per-platform package.
  cloudflared: false
  # Not needed: Next.js image optimization is unused, and the resolver works without its native build.
  sharp: false
  unrs-resolver: false
