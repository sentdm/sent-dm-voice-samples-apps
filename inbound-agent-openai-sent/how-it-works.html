<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>How it works · Sent inbound agent</title>
<style>
:root {
  --paper: #f5f4ef; --panel: #fffefa; --ink: #1a1c20; --muted: #63666d;
  --line: #d7d6d0; --line-dark: #b8b7b0;
  --cobalt: #2256bf; --cobalt-dark: #163b83; --cobalt-bg: #e9effb;
  --amber: #b26a00; --amber-bg: #fff4d6;
  --red: #a32920; --red-bg: #fff0ed;
  --green: #16734c; --green-bg: #e7f3ec;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; color: var(--ink); font: 15px/1.5 var(--sans);
  background: linear-gradient(90deg, rgba(26, 28, 32, .025) 1px, transparent 1px) 0 0 / 40px 40px, var(--paper);
}
button, select { font: inherit; color: inherit; }
.wrap { max-width: 1720px; margin: 0 auto; padding: 0 24px 24px; }

/* Masthead — mirrors public/styles.css */
.mast { min-height: 64px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: inline-flex; align-items: center; gap: 10px; letter-spacing: -.04em; font-size: 19px; }
.brand small { color: var(--muted); font-size: 15px; letter-spacing: -.03em; margin-left: 4px; }
.brand-mark { position: relative; display: inline-flex; width: 24px; height: 18px; align-items: center; justify-content: space-between; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; top: 8px; width: 21px; height: 1px; background: var(--ink); }
.brand-mark::before { transform: rotate(32deg); }
.brand-mark::after { transform: rotate(-32deg); }
.brand-mark i { z-index: 1; width: 5px; height: 5px; display: block; background: var(--paper); border: 1px solid var(--ink); border-radius: 50%; }
.badge { font: 11px/1.1 var(--mono); letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); padding: 7px 8px; }

/* Chapters */
.chapters { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 14px; scrollbar-width: none; }
.chapters button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 13px 10px; font: 12px/1.2 var(--mono); letter-spacing: .03em; color: var(--muted); white-space: nowrap; cursor: pointer; }
.chapters button b { color: var(--line-dark); font-weight: 600; margin-right: 6px; }
.chapters button:hover { color: var(--ink); }
.chapters button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--cobalt); }
.chapters button[aria-current="true"] b { color: var(--cobalt); }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 16px; align-items: start; }
@media (max-width: 1180px) { .layout { grid-template-columns: 1fr; } .narr { position: static !important; max-height: none !important; } }
.stage { background: var(--panel); border: 1px solid var(--line); }
#diagram { display: block; width: 100%; height: auto; }
.stage-foot { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding: 10px 14px; }
.phases { display: flex; align-items: center; gap: 5px; font: 11px/1 var(--mono); flex-wrap: wrap; }
.phases .lbl { color: var(--muted); margin-right: 4px; letter-spacing: .08em; }
.phases .ph { padding: 5px 7px; border: 1px solid var(--line); color: var(--muted); transition: background .25s, color .25s; }
.phases .ph.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.phases i { width: 8px; height: 1px; background: var(--line-dark); }
.legend { display: flex; gap: 14px; font: 11px/1 var(--mono); color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* Narration */
.narr { background: var(--panel); border: 1px solid var(--line); padding: 20px 22px 18px; position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; }
.kicker { display: flex; justify-content: space-between; gap: 10px; font: 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.kicker #chap { color: var(--cobalt); }
.narr h2 { font-size: 22px; line-height: 1.22; letter-spacing: -.02em; margin: 12px 0 12px; }
.narr .body p { margin: 0 0 10px; }
.narr .body ul { margin: 0 0 10px; padding-left: 18px; }
.narr .body li { margin-bottom: 5px; }
.narr code { font: 12.5px var(--mono); background: #efeee8; padding: 1px 4px; }
pre.payload { font: 11px/1.55 var(--mono); background: var(--ink); color: #e9e7df; padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 14px 0 12px; border-left: 3px solid var(--amber); }
pre.payload:empty { display: none; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; }
.refs a { font: 11px/1 var(--mono); color: var(--cobalt-dark); border: 1px solid var(--line); padding: 6px 7px; text-decoration: none; background: #fff; }
.refs a:hover { border-color: var(--cobalt); }
.dwell { height: 2px; background: var(--line); margin: 16px 0 0; overflow: hidden; }
.dwell i { display: block; height: 100%; width: 0; background: var(--cobalt); }

/* Controls */
.controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-dark); background: var(--panel); padding: 7px 11px; cursor: pointer; min-width: 40px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 92px; }
.speed { border: 1px solid var(--line-dark); background: var(--panel); padding: 7px 6px; }
.timeline { display: flex; gap: 3px; align-items: center; margin-top: 14px; }
.timeline button { flex: 1; height: 8px; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.timeline button.done { background: var(--line-dark); }
.timeline button.cur { background: var(--cobalt); }
.timeline .gap { flex: 0 0 6px; }
.hint { font: 11px/1.4 var(--mono); color: var(--muted); margin-top: 10px; }

/* ---------- SVG ---------- */
svg text { font-family: var(--sans); fill: var(--ink); }
.region-label { font: 600 11px var(--mono); letter-spacing: .12em; fill: var(--muted); }
.edge-label { font: 10px var(--mono); fill: var(--muted); letter-spacing: .02em; }
.frame { fill: rgba(255, 254, 250, .72); stroke: var(--line-dark); }
.frame-bar { fill: #ecebe5; }
.frame-t { font: 11px var(--mono) !important; fill: var(--muted) !important; letter-spacing: .06em; }
.node .box { fill: var(--panel); stroke: var(--line-dark); stroke-width: 1.2; transition: stroke .3s, stroke-width .3s; }
.node .t { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.node .l { font: 11.5px var(--mono); fill: var(--muted); }
.node .l.warm { fill: var(--amber); font-weight: 600; }
.node .l.live { fill: var(--green); font-weight: 600; }
.node .l.cob { fill: var(--cobalt); font-weight: 600; }
.node { transition: opacity .35s; }
.node.dim { opacity: .42; }
.node.dim .box { stroke-dasharray: 4 4; }
.node.lit .box { stroke: var(--cobalt); stroke-width: 2.2; filter: url(#glow); }
.node.flash .box { stroke: var(--ink); stroke-width: 2.4; }
.node.ringing .box { animation: ring .5s ease-in-out infinite alternate; }
@keyframes ring { from { stroke: var(--line-dark); } to { stroke: var(--cobalt); stroke-width: 3; } }
.pill rect { fill: #efeee8; }
.pill text { font: 11px var(--mono); fill: var(--ink); }
.pill.on rect { fill: var(--ink); }
.pill.on text { fill: var(--panel); }
.hb circle { fill: var(--line-dark); }
.hb.on circle { fill: var(--green); animation: beat 1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes beat { 0% { transform: scale(1); } 15% { transform: scale(1.6); } 30% { transform: scale(1); } }
.edge { fill: none; stroke: var(--line-dark); stroke-width: 1.3; stroke-dasharray: 2 5; stroke-linecap: round; }
.edge.hot { stroke-dasharray: none; stroke-width: 2.2; }
.edge.dotted { stroke-dasharray: 1 4; }
.pkt-t { font: 11px var(--mono) !important; fill: #fff !important; }
.stamp, .bubble { transform-box: fill-box; transform-origin: center bottom; animation: pop .28s cubic-bezier(.2, 1.4, .4, 1); }
.stamp text { font: 600 11px var(--mono) !important; fill: #fff !important; }
.bubble text { font-size: 13.5px; }
.bubble .who { font: 600 10px var(--mono); letter-spacing: .1em; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.q-bg { fill: #efeee8; }
.q-cap { stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 2 2; }
@media (prefers-reduced-motion: reduce) {
  .stamp, .bubble, .hb.on circle, .node.ringing .box { animation: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>Sent</strong><small>/ inbound — how it works</small></span>
    </div>
    <div class="badge">ANIMATED WALKTHROUGH · v1.1.0</div>
  </header>

  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>

  <div class="layout">
    <section class="stage" aria-label="Architecture diagram">
      <svg id="diagram" viewBox="0 0 1280 720" role="img" aria-label="Animated architecture diagram of the Sent inbound agent">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2256bf" flood-opacity=".35" />
          </filter>
        </defs>
      </svg>
      <div class="stage-foot">
        <div class="phases" id="phases"><span class="lbl">SERVER PHASE</span></div>
        <div class="legend">
          <span style="--c: var(--cobalt)">caller audio</span>
          <span style="--c: var(--amber)">agent audio / secrets</span>
          <span style="--c: var(--ink)">control / HTTP</span>
          <span style="--c: var(--green)">ok</span>
          <span style="--c: var(--red)">blocked / cleared</span>
        </div>
      </div>
    </section>

    <aside class="narr" aria-live="polite">
      <div class="kicker"><span id="chap"></span><span id="count"></span></div>
      <h2 id="title"></h2>
      <div class="body" id="body"></div>
      <pre class="payload" id="payload"></pre>
      <div class="refs" id="refs"></div>
      <div class="dwell"><i id="dwell"></i></div>
      <div class="controls">
        <button class="btn" id="prev" title="Previous step (←)">◀</button>
        <button class="btn primary" id="play" title="Play / pause (space)">❚❚ Pause</button>
        <button class="btn" id="next" title="Next step (→)">▶</button>
        <select class="speed" id="speed" aria-label="Speed">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </div>
      <div class="timeline" id="timeline"></div>
      <p class="hint">← → step · space pause · 1–9 jump to chapter</p>
    </aside>
  </div>
</div>

<script>
'use strict';
/* =========================================================================
   Sent inbound agent — animated walkthrough
   Everything here is derived from src/, client/ and public/ in this repo.
   ========================================================================= */

// ─── Pacing ───────────────────────────────────────────────────────────────
// How long a finished step lingers before autoplay moves on. Called once per
// step after its animation completes; return milliseconds at 1× speed.
// `step` has: title, body (HTML string), payload (string), beats, streams.
function dwellTime(step) {
  return 6000;
}

// ─── Tiny clock-driven animation runtime (pause + speed for free) ────────
let clock = 0, lastT = performance.now(), frozen = false, speed = 1;
const tickers = new Set();
function loop(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  if (!frozen) clock += dt * speed;
  for (const fn of Array.from(tickers)) if (tickers.has(fn) && fn(clock) === false) tickers.delete(fn);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const wait = (ms) => new Promise((res) => { const end = clock + ms; tickers.add((c) => (c >= end ? (res(), false) : true)); });
const animate = (ms, fn) => new Promise((res) => {
  const start = clock;
  tickers.add((c) => { const t = Math.min(1, (c - start) / ms); fn(t); if (t >= 1) { res(); return false; } return true; });
});
const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// ─── SVG helpers ──────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('diagram');
function el(tag, attrs = {}, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function roundedPath(pts, r = 10) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1);
    const rr = Math.min(r, d1 / 2, d2 / 2);
    d += ` L${x1 + (x0 - x1) * rr / d1},${y1 + (y0 - y1) * rr / d1} Q${x1},${y1} ${x1 + (x2 - x1) * rr / d2},${y1 + (y2 - y1) * rr / d2}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]},${last[1]}`;
}
const L = {};
for (const k of ['bg', 'edges', 'nodes', 'fx', 'pkts']) L[k] = el('g', { class: 'layer-' + k }, svg);
const COLORS = { ctrl: '#1a1c20', caller: '#2256bf', agent: '#b26a00', ok: '#16734c', bad: '#a32920' };

// ─── Regions & containers ────────────────────────────────────────────────
el('rect', { x: 12, y: 282, width: 1256, height: 430, rx: 4, fill: 'rgba(34,86,191,.035)', stroke: 'rgba(34,86,191,.28)', 'stroke-dasharray': '6 6' }, L.bg);
el('text', { class: 'region-label', x: 1255, y: 270, 'text-anchor': 'end' }, L.bg, '▲ THE INTERNET');
el('text', { class: 'region-label', x: 1255, y: 304, 'text-anchor': 'end' }, L.bg, '▼ YOUR COMPUTER');
el('text', { class: 'edge-label', x: 1255, y: 320, 'text-anchor': 'end' }, L.bg, 'servers bind 127.0.0.1');
function container(x, y, w, h, title) {
  el('rect', { class: 'frame', x, y, width: w, height: h, rx: 6 }, L.bg);
  el('path', { class: 'frame-bar', d: `M${x + .5},${y + 28} V${y + 6} Q${x + .5},${y + .5} ${x + 6},${y + .5} H${x + w - 6} Q${x + w - .5},${y + .5} ${x + w - .5},${y + 6} V${y + 28} Z` }, L.bg);
  for (let i = 0; i < 3; i++) el('circle', { cx: x + 16 + i * 13, cy: y + 14, r: 4, fill: '#d7d6d0' }, L.bg);
  el('text', { class: 'frame-t', x: x + 60, y: y + 18 }, L.bg, title);
}
container(30, 300, 560, 400, 'BROWSER TAB · http://localhost:3000 · client/app.ts');
container(630, 300, 450, 400, 'NODE.JS PROCESS · pnpm start · src/server.ts');

// ─── Nodes ────────────────────────────────────────────────────────────────
const NODE = {}, T = {}, PILL = {};
function node(id, x, y, w, h, title, lines = [], opts = {}) {
  const g = el('g', { class: 'node', id: 'n-' + id }, L.nodes);
  el('rect', { class: 'box', x, y, width: w, height: h, rx: opts.rx ?? 5 }, g);
  el('text', { class: 't', x: x + 14, y: y + 26, style: opts.titleSize ? `font-size:${opts.titleSize}px` : '' }, g, title);
  lines.forEach((ln, i) => {
    const spec = typeof ln === 'string' ? { text: ln } : ln;
    const t = el('text', { class: 'l', x: x + 14, y: y + 46 + i * (opts.lh ?? 17), style: opts.lineSize ? `font-size:${opts.lineSize}px` : '' }, g, spec.text ?? '');
    if (spec.id) T[spec.id] = t;
  });
  NODE[id] = { g, x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
  return g;
}
function pill(id, x, y, parent) {
  const g = el('g', { class: 'pill' }, parent);
  const r = el('rect', { x, y, width: 40, height: 20, rx: 3 }, g);
  const t = el('text', { x: x + 7, y: y + 14 }, g, '');
  PILL[id] = { g, r, t };
}
function setPill(id, text, on) {
  const p = PILL[id]; p.t.textContent = text;
  p.r.setAttribute('width', p.t.getComputedTextLength() + 14);
  p.g.classList.toggle('on', !!on);
}

// Internet
node('phone', 30, 70, 120, 150, 'Caller', ['PSTN / mobile', { id: 'phone-st', text: 'idle' }], { rx: 18 });
el('rect', { x: 75, y: 196, width: 30, height: 4, rx: 2, fill: '#d7d6d0' }, NODE.phone.g);
node('sent', 250, 70, 260, 150, 'Sent cloud', ['+1 628 555 0199 · ACTIVE', { id: 'sent-cb', text: '' }, 'REST /v3 · push · WebRTC', 'identity routing'], { lh: 18 });
node('cf', 640, 85, 240, 120, 'Cloudflare edge', ['quick tunnel · no account', { id: 'cf-url', text: '' }], { lh: 20 });
node('openai', 1000, 70, 250, 150, 'OpenAI', ['wss  /v1/realtime · /v1/live', 'https /v1/models · /v1/responses', { id: 'oa-model', text: '' }], { lh: 18 });

// Browser tab internals
node('sdk', 55, 360, 140, 240, '@sentdm/voice', ['Sent browser SDK', 'WebRTC (Sinch)', '', { id: 'sdk-st', text: '' }, { id: 'sdk-id', text: '' }], { titleSize: 14 });
node('remote', 225, 360, 160, 70, '<audio> muted', ['caller stream only'], { titleSize: 14 });
node('mic', 225, 530, 160, 70, 'Software mic', ['Web Audio output', 'via getUserMedia()'], { titleSize: 14, lh: 15 });
node('wk', 415, 360, 160, 130, 'AudioWorklet', ['24 kHz · 20 ms', 'Float32 ⇄ PCM16'], { titleSize: 14 });
node('bridge', 415, 520, 160, 80, 'ModelBridge', ['WS → /bridge', 'binary PCM + JSON'], { titleSize: 14 });
node('ui', 55, 625, 520, 55, 'Dashboard', [{ id: 'ui-st', text: '' }], { titleSize: 14 });
T['ui-st'].setAttribute('y', 625 + 44);

// Worklet playback queue meter
const Q = { x: 429, y: 460, w: 132 };
el('text', { class: 'l', x: Q.x, y: Q.y - 6, style: 'font-size:10px' }, NODE.wk.g, 'playback queue');
el('rect', { class: 'q-bg', x: Q.x, y: Q.y, width: Q.w, height: 10, rx: 2 }, NODE.wk.g);
const qFill = el('rect', { x: Q.x, y: Q.y, width: 0, height: 10, rx: 2, fill: COLORS.agent }, NODE.wk.g);
el('line', { class: 'q-cap', x1: Q.x + Q.w * .9, x2: Q.x + Q.w * .9, y1: Q.y - 3, y2: Q.y + 13 }, NODE.wk.g);

// Heartbeat indicator in the dashboard
const hb = el('g', { class: 'hb' }, NODE.ui.g);
el('text', { class: 'l', x: 488, y: 646, style: 'font-size:10px' }, hb, 'heartbeat');
el('circle', { cx: 556, cy: 642, r: 5 }, hb);

// Node.js process internals
node('cfd', 655, 355, 150, 85, 'cloudflared', ['child process', { id: 'cfd-st', text: '' }], { titleSize: 14 });
node('gw', 835, 355, 220, 85, 'Gateway · :random', ['/health · /voice/<nonce>', 'HMAC → decideInbound()'], { titleSize: 14 });
node('mgmt', 655, 475, 210, 205, 'Management · :3000', ['/api/*  Host·Origin·CSRF', '/bridge  WS + token', 'watchdog  beat < 7 s'], { titleSize: 14 });
pill('phase', 669, 580, NODE.mgmt.g);
pill('keys', 669, 608, NODE.mgmt.g);
pill('calls', 669, 636, NODE.mgmt.g);
node('oai', 895, 475, 160, 95, 'OpenAI adapter', ['src/openai.ts', '1 session per call'], { titleSize: 14 });
node('disk', 1100, 560, 155, 130, 'Disk', ['.sent-agent/', 'routing-backup.json', { id: 'disk-1', text: '' }, { id: 'disk-2', text: '' }, { id: 'disk-3', text: '' }], { lineSize: 10.5, lh: 15 });

// ─── Edges (two lanes where traffic flows both ways) ─────────────────────
const E = {};
function edge(id, def, cls = '') {
  E[id] = el('path', { class: 'edge ' + cls, d: typeof def === 'string' ? def : roundedPath(def) }, L.edges);
}
edge('phone>sent', [[150, 132], [250, 132]]);
edge('sent>phone', [[250, 158], [150, 158]]);
edge('sent>cf', [[510, 128], [640, 128]]);
edge('cf>sent', [[640, 162], [510, 162]]);
edge('cf>cfd', [[722, 205], [722, 355]]);
edge('cfd>cf', [[738, 355], [738, 205]]);
edge('cfd>gw', [[805, 390], [835, 390]]);
edge('gw>cfd', [[835, 406], [805, 406]]);
edge('sent>sdk', 'M300,220 C300,300 117,290 117,360');
edge('sdk>sent', 'M133,360 C133,305 316,305 316,220');
edge('mgmt>sent', [[655, 500], [615, 500], [615, 250], [478, 250], [478, 220]]);
edge('sent>mgmt', [[462, 220], [462, 262], [603, 262], [603, 512], [655, 512]]);
edge('bridge>mgmt', [[575, 552], [655, 552]]);
edge('mgmt>bridge', [[655, 568], [575, 568]]);
edge('ui>mgmt', [[575, 645], [655, 645]]);
edge('mgmt>ui', [[655, 662], [575, 662]]);
edge('mgmt>oai', [[865, 505], [895, 505]]);

function edgeFor(a, b) {
  if (E[a + '>' + b]) return { p: E[a + '>' + b], rev: false };
  if (E[b + '>' + a]) return { p: E[b + '>' + a], rev: true };
  return null;
}
const hotCount = new Map();
function heat(p, color) { hotCount.set(p, (hotCount.get(p) || 0) + 1); p.classList.add('hot'); p.style.stroke = color; }
function cool(p) {
  const n = (hotCount.get(p) || 1) - 1;
  if (n <= 0) { hotCount.delete(p); p.classList.remove('hot'); p.style.stroke = ''; } else hotCount.set(p, n);
}
function resetEdges() { hotCount.clear(); for (const p of Object.values(E)) { p.classList.remove('hot'); p.style.stroke = ''; } }

function flashNode(id) {
  const n = NODE[id]; if (!n) return;
  n.g.classList.add('flash'); setTimeout(() => n.g.classList.remove('flash'), 450);
}
function travel(from, to, { label, c = 'ctrl', small = false, rate } = {}) {
  const ed = edgeFor(from, to);
  if (!ed) { console.warn('No edge', from, to); return Promise.resolve(); }
  const len = ed.p.getTotalLength();
  const dur = Math.max(small ? 240 : 560, len / (rate ?? (small ? .42 : .3)));
  const color = COLORS[c] ?? c;
  const g = el('g', {}, L.pkts);
  const dot = el('circle', { r: small ? 4.2 : 6.5, fill: color, stroke: '#fffefa', 'stroke-width': 2 }, g);
  let lab, lw = 0;
  if (label) {
    lab = el('g', {}, g);
    const r = el('rect', { x: 0, y: -13, height: 19, rx: 3, fill: color }, lab);
    const t = el('text', { class: 'pkt-t', x: 6, y: 1 }, lab, label);
    lw = t.getComputedTextLength() + 12; r.setAttribute('width', lw);
  }
  heat(ed.p, color);
  return animate(dur, (t) => {
    const e = small ? t : ease(t);
    const pt = ed.p.getPointAtLength((ed.rev ? 1 - e : e) * len);
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
    if (lab) {
      const x = Math.max(6, Math.min(1274 - lw, pt.x + 11));
      const y = Math.max(16, Math.min(706, pt.y - 12));
      lab.setAttribute('transform', `translate(${x},${y})`);
    }
  }).then(() => { g.remove(); cool(ed.p); if (!small) flashNode(to); });
}
async function travelRoute(route, c, rate) {
  for (let i = 0; i < route.length - 1; i++) await travel(route[i], route[i + 1], { c, small: true, rate });
}
const stampStack = {};
function stamp(id, text, c = 'ok') {
  const n = NODE[id]; if (!n) return Promise.resolve();
  const k = (stampStack[id] = (stampStack[id] || 0) + 1) - 1;
  const g = el('g', { class: 'stamp' }, L.fx);
  const r = el('rect', { y: 0, height: 20, rx: 3, fill: COLORS[c] ?? c }, g);
  const t = el('text', { x: 7, y: 14 }, g, text);
  const w = t.getComputedTextLength() + 14; r.setAttribute('width', w);
  const x = Math.max(6, Math.min(1274 - w, n.x + n.w - w + 8));
  const y = Math.max(4, n.y - 11 - k * 23);
  g.setAttribute('transform', `translate(${x},${y})`);
  wait(2800).then(() => { g.remove(); stampStack[id] = Math.max(0, (stampStack[id] || 1) - 1); });
  return wait(520);
}
const bubbles = {};
function say(who, text) {
  bubbles[who]?.remove();
  const g = el('g', { class: 'bubble ' + who }, L.fx);
  const color = who === 'caller' ? COLORS.caller : COLORS.agent;

  const tipX = who === 'caller' ? x + 50 : x + w - 110;

  el('rect', { x: tipX - 1, y: 49, width: 17, height: 3, fill: bg }, g);
  bubbles[who] = g;

}
function setQueue(v) { S.queue = v; qFill.setAttribute('width', Q.w * v); qFill.setAttribute('fill', v > .88 ? COLORS.bad : COLORS.agent); }
function queueTo(target, ms) {

  if (it.stamp) return stamp(it.stamp, it.text, it.c);
  if (it.say) return say(it.say, it.text);
  if (it.queue !== undefined) return queueTo(it.queue, it.ms ?? 600);
  if (it.wait) return wait(it.wait);
  if (it.flash) { flashNode(it.flash); return wait(250); }
  if (it.burst) return burst(it.burst, it.c, it.n, it.every);
  return Promise.resolve();
}

let cur = 0, token = 0, auto = true, stepDone = false;
const $ = (id) => document.getElementById(id);
const dwellBar = $('dwell');

async function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  cur = i; const my = ++token; stepDone = false;
  tickers.clear(); L.pkts.replaceChildren(); L.fx.replaceChildren(); resetEdges();
  for (const k in stampStack) delete stampStack[k];
  for (const k in bubbles) delete bubbles[k];
  dwellBar.style.width = '0';
  const step = STEPS[i];
  Object.assign(S, stateBefore(i)); render();
  for (const id in NODE) NODE[id].g.classList.toggle('lit', (step.lit || []).includes(id));
  narrate(i);
  history.replaceState(null, '', '#step-' + (i + 1));
  for (const st of step.streams || []) startStream(st);
  await wait(250);
  for (const beat of step.beats || []) {
    if (my !== token) return;
    await Promise.all(itemsOf(beat).map(runItem));
    if (my !== token) return;
    await wait(140);
  }
  if (my !== token) return;
  stepDone = true;
  if (auto) advanceAfterDwell(my);
}
let dwellId = 0;
async function advanceAfterDwell(my) {
  const d = ++dwellId;
  const ms = Math.max(800, Number(dwellTime(STEPS[cur])) || 6000);
  await animate(ms, (t) => { if (d === dwellId) dwellBar.style.width = (t * 100) + '%'; });
  if (my !== token || !auto || d !== dwellId) return;
  if (cur < STEPS.length - 1) go(cur + 1);
  else { auto = false; syncPlay(true); }
}

// ─── Narration, chapters, timeline, controls ─────────────────────────────
const chaptersEl = $('chapters'), timelineEl = $('timeline');
CHAPTERS.forEach((name, c) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${String(c).padStart(2, '0')}</b>${name}`;
  b.addEventListener('click', () => { frozen = false; go(STEPS.findIndex((s) => s.ch === c)); });
  chaptersEl.appendChild(b);
});
STEPS.forEach((s, i) => {
  if (i && STEPS[i - 1].ch !== s.ch) { const g = document.createElement('span'); g.className = 'gap'; timelineEl.appendChild(g); }
  const b = document.createElement('button');
  b.title = `${i + 1}. ${s.title}`; b.setAttribute('aria-label', b.title);
  b.addEventListener('click', () => { frozen = false; go(i); });
  timelineEl.appendChild(b);
});
function narrate(i) {
  const s = STEPS[i];
  $('chap').textContent = `${String(s.ch).padStart(2, '0')} · ${CHAPTERS[s.ch]}`;
  $('count').textContent = `Step ${i + 1} / ${STEPS.length}`;
  $('title').textContent = s.title;
  $('body').innerHTML = s.body;
  $('payload').textContent = s.payload || '';
  const refs = $('refs'); refs.replaceChildren();
  for (const r of s.refs || []) {
    const a = document.createElement('a');
    const [file, line] = r.split(':');
    a.href = file; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = r; if (line) a.title = `${file}, line ${line}`;
    refs.appendChild(a);
  }
  chaptersEl.querySelectorAll('button').forEach((b, c) => b.setAttribute('aria-current', String(c === s.ch)));
  timelineEl.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('cur', k === i); b.classList.toggle('done', k < i); });
}
const playBtn = $('play');
function syncPlay(ended = false) {
  const playing = auto && !frozen;
  playBtn.textContent = playing ? '❚❚ Pause' : ended ? '↺ Replay' : '▶ Play';
}
playBtn.addEventListener('click', () => {
  if (auto && !frozen) { auto = false; frozen = true; }
  else if (!auto && cur === STEPS.length - 1 && stepDone) { auto = true; frozen = false; go(0); }
  else { auto = true; frozen = false; if (stepDone) advanceAfterDwell(token); }
  syncPlay();
});
$('next').addEventListener('click', () => { frozen = false; go(cur + 1); syncPlay(); });
$('prev').addEventListener('click', () => { frozen = false; go(cur - 1); syncPlay(); });
$('speed').addEventListener('change', (e) => { speed = Number(e.target.value) || 1; });
document.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLSelectElement) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
  else if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  else if (/^[1-9]$/.test(e.key)) { const c = Number(e.key) - 1; if (c < CHAPTERS.length) { frozen = false; go(STEPS.findIndex((s) => s.ch === c)); syncPlay(); } }
});

const fromHash = Number((location.hash.match(/step-(\d+)/) || [])[1]);
go(Number.isInteger(fromHash) && fromHash > 0 ? fromHash - 1 : 0);
syncPlay();
</script>
</body>
</html>
